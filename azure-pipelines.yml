trigger:
 - main
pool: octoberagent
stages:
  - stage: validate
    displayName: validate_stage
    jobs:
      - job: validate
        displayName: validate
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'bakshibabu'
            backendAzureRmStorageAccountName: 'pipelinetfstate'
            backendAzureRmContainerName: 'xyzcontainer'
            backendAzureRmKey: 'souavterraform.tfstate'

  - stage: plan
    displayName: plan
    jobs:
      - job: plan
        displayName: plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'bakshibabu'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: 'souravterraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'bakshibabu'

  - stage: approval
    displayName: approval
    pool: server
    jobs:
      - job: approval
        displayName: approval
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'abc'

  - stage: apply
    displayName: apply
    jobs:
      - job: apply
        displayName: apply
        
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'bakshibabu'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: 'souravterraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'bakshibabu'