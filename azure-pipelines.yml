trigger:
 - main
pool:octoberagent
stages:
  - stage: validate
    displayName: validate_stage
    jobs:
      - job: buildjob
        displayName: validate
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'bakshibabu'
            backendAzureRmStorageAccountName: 'pipelinetfstate'
            backendAzureRmContainerName: 'xyzcontainer'
            backendAzureRmKey: 'souavterraform.tfstate'
        
stages:
  - stage: plan
    displayName: plan
    jobs:
      - job: buildjob
        displayName: plan
        steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'bakshibabu'
          backendAzureRmStorageAccountName: 'pipelinetfstate'
          backendAzureRmContainerName: 'xyzcontainer'
          backendAzureRmKey: 'souravvalidate.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          environmentServiceNameAzureRM: 'bakshibabu'
stages:
  - stage: plan
    displayName: plan
    jobs:
      - job: buildjob
        displayName: plan
        steps: